<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account · Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-rail">
      <div class="rail-brand"><span></span></div>
      <nav class="rail-nav">
        <a class="rail-btn" href="/chat.html" title="Chats" aria-label="Chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </a>
      </nav>
      <div class="rail-bottom">
        <button class="rail-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="rail-btn active" title="Account" aria-label="Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </aside>

    <div class="main-area" style="grid-template-columns:1fr;">
      <section class="chat-panel" style="overflow:hidden;">
        <div class="profile-wrap">
          <div class="profile-header">
            <h1>Account</h1>
          </div>

          <div id="toastAnchor"></div>

          <div class="profile-grid">
            <!-- Left: identity card -->
            <div class="panel profile-card">
              <div class="avatar xl" id="profileAvatar"></div>
              <div class="name" id="profileName">—</div>
              <div class="handle" id="profileHandle">—</div>
              <div class="joined" id="profileJoined"></div>

              <label for="avatarUpload" class="btn-secondary change-avatar-btn" style="display:block;">Change photo</label>
              <input type="file" id="avatarUpload" accept="image/png,image/jpeg,image/gif,image/webp" class="visually-hidden" />

              <button class="btn-danger" id="logoutBtn" style="width:100%; margin-top:10px;">Log out</button>
            </div>

            <!-- Right: editable details -->
            <div>
              <div class="panel" style="margin-bottom:22px;">
                <h2>Profile information</h2>
                <div id="profileError" class="form-error"></div>
                <div id="profileSuccess" class="form-success"></div>

                <form id="profileForm">
                  <div class="field-row">
                    <div class="field">
                      <label for="editFullName">Full name</label>
                      <input id="editFullName" type="text" required />
                    </div>
                    <div class="field">
                      <label for="editUsername">Username</label>
                      <input id="editUsername" type="text" required />
                    </div>
                  </div>
                  <div class="field">
                    <label for="editEmail">Email</label>
                    <input id="editEmail" type="email" required />
                  </div>
                  <div class="field-actions">
                    <button class="btn-primary" type="submit" style="width:auto; padding:10px 22px;">Save changes</button>
                  </div>
                </form>
              </div>

              <div class="panel">
                <h2>Change password</h2>
                <div id="passwordError" class="form-error"></div>
                <div id="passwordSuccess" class="form-success"></div>

                <form id="passwordForm">
                  <div class="field">
                    <label for="currentPassword">Current password</label>
                    <input id="currentPassword" type="password" autocomplete="current-password" required />
                  </div>
                  <div class="field-row">
                    <div class="field">
                      <label for="newPassword">New password</label>
                      <input id="newPassword" type="password" autocomplete="new-password" required />
                    </div>
                    <div class="field">
                      <label for="confirmPassword">Confirm new password</label>
                      <input id="confirmPassword" type="password" autocomplete="new-password" required />
                    </div>
                  </div>
                  <div class="field-actions">
                    <button class="btn-primary" type="submit" style="width:auto; padding:10px 22px;">Update password</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
